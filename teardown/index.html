<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>线稿拆解</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:#161616;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Arial,sans-serif}
body{max-width:520px;margin:0 auto;padding:28px 18px 48px}
header h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}
header p{margin:8px 0 0;color:#666;font-size:13px;line-height:1.5}
ol{list-style:none;margin:22px 0 0;padding:0;display:flex;flex-direction:column;gap:12px}
a.card{display:grid;grid-template-columns:72px 1fr;gap:14px;align-items:center;text-decoration:none;color:inherit;border:1px solid #ececec;border-radius:16px;padding:12px 14px;background:#fff}
a.card:active{background:#fafafa}
.mark{width:72px;height:72px;border-radius:12px;background:#f6f6f6;display:flex;align-items:center;justify-content:center}
.mark svg{width:54px;height:54px;display:block}
.mark path{fill:none;stroke:#111;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
h2{margin:0;font-size:16px;font-weight:650}
h2 span{display:block;margin-top:3px;font-size:12px;font-weight:500;color:#777;line-height:1.45}
footer{margin-top:22px;font-size:11px;line-height:1.5;color:#999}
</style>
</head>
<body>
<header>
<h1>线稿拆解</h1>
<p>三件可滑动打开的隐藏线示意图。向下滑动拆开，再滑回来装上。</p>
</header>
<ol>

<li><a class="card" href="lola/">

<span><h2>Luceplan Lola 落地灯<span>Meda 与 Rizzatto，1987 · 图示中等高度约 1800 mm，底座 Ø480</span></h2></span>

</ol>
<footer>这些页面是独立的静态线稿，不改动本站首页的拍立得照片墙。车身图未使用官方标志。</footer>
</body>
